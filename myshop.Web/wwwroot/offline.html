<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Offline</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: linear-gradient(135deg, #eef2f7 0%, #d9e4f5 40%, #c3dafe 100%);
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.5rem;
        }

        .offline-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 2.5rem 2rem;
            max-width: 380px;
            width: 100%;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .offline-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 1.25rem;
            border-radius: 50%;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        }

            .offline-icon svg {
                width: 34px;
                height: 34px;
                fill: #fff;
            }

        h1 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1a1a2e;
            margin: 0 0 0.5rem;
        }

        p {
            color: #667;
            margin: 0 0 1.5rem;
            font-size: 0.95rem;
        }

        #retryBtn {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 0.7rem 1.4rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
            transition: 0.3s;
        }

            #retryBtn:hover {
                background: linear-gradient(135deg, #005bea 0%, #00c6fb 100%);
                transform: translateY(-3px);
                box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
            }

        #statusNote {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #99a;
        }
    </style>
</head>
<body>

    <div class="offline-card">
        <div class="offline-icon">
            <svg viewBox="0 0 24 24"><path d="M23.64 7c-.45-.34-4.93-4-11.64-4-1.5 0-2.89.19-4.15.48L18.18 13.8 23.64 7zm-6.6 8.22L3.27 1.44 2 2.72l2.05 2.06C1.91 5.76.59 6.82.36 7l11.63 14.49.01.01.01-.01 3.9-4.86 3.32 3.32 1.27-1.27-3.46-3.46z" /></svg>
        </div>
        <h1>You're Offline</h1>
        <p>Check your internet connection and try again.</p>
        <button id="retryBtn" onclick="retry()">Retry</button>
        <div id="statusNote">Waiting for connection...</div>
    </div>

    <script>
        function retry() {
            if (navigator.onLine) {
                if (navigation.canGoBack)
                    window.navigation.back();
                else window.location.href = `/`;
            }
            else location.reload();
        }

        function updateStatus() {
            document.getElementById("statusNote").textContent =
                navigator.onLine ? "Connection restored — reloading..." : "Waiting for connection...";
        }

        window.addEventListener("online", () => {
            if (navigation.canGoBack)
                window.navigation.back();
            else window.location.href = `/`;

        });

        window.addEventListener("online", updateStatus);
        window.addEventListener("offline", updateStatus);
    </script>
</body>
</html>
